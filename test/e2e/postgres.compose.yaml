# PostgreSQL for tops' e2e fleet, on VPSLAB's network. make lab-up starts it after the nodes.
name: tops-e2e
services:
  vps-pg:
    image: postgres:17.11
    container_name: vps-pg
    hostname: vps-pg
    restart: unless-stopped
    command: postgres -c max_connections=300
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TOPS_PG_PASSWORD:?make lab-up writes it to test/e2e/fleet/environments/lab/secrets.env}
    networks:
      vpslab:
        ipv4_address: 10.80.0.20
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  data:
networks:
  vpslab:
    external: true
