name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: make vuln

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make build (${{ matrix.target }})
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" CGO_ENABLED=0
          make build
        env:
          TARGET: ${{ matrix.target }}
      - name: binary is under 35 MB
        run: test "$(stat -c %s bin/tops)" -lt 36700160

  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # Temporal's checkout, its modules and its build cache: a cold run downloads and compiles all of it.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/go/pkg/mod
            ~/.cache/go-build
          key: generate-${{ runner.os }}-${{ hashFiles('tools/cataloggen/versions.txt', 'tools/cataloggen/go.sum') }}
      - run: make generate
      - name: the catalog is up to date and byte-stable
        run: git diff --exit-code internal/catalog/
