version: "2"

# Lint the files behind build tags too: the helper tests run only with make helper-test.
run:
  build-tags: [helper]

linters:
  enable:
    - revive
    - gosec
    - errorlint
    - gocyclo
    - misspell
    - bodyclose
    - noctx
    - sloglint
    - contextcheck
  settings:
    gocyclo:
      min-complexity: 10

formatters:
  enable:
    - gofmt
